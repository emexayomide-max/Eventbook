name: EventBook Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/EventBookGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Create Terraform variables
        run: |
          cat > terraform.tfvars <<EOF
          aws_region    = "${{ env.AWS_REGION }}"
          admin_ip      = "${{ secrets.TF_ADMIN_IP }}"
          ami_id        = "${{ secrets.TF_AMI_ID }}"
          instance_type = "t3.micro"
          key_name      = "${{ secrets.TF_KEY_NAME }}"
          EOF

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false